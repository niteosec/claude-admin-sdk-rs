[workspace]
resolver = "3"
members = ["crates/claude-api-core", "crates/claude-compliance"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.87"
license = "MIT OR Apache-2.0"
repository = "https://github.com/niteosec/claude-admin-sdk-rs"
homepage = "https://github.com/niteosec/claude-admin-sdk-rs"
authors = ["Niteo Security"]

[workspace.dependencies]
claude-api-core = { path = "crates/claude-api-core", version = "0.1.0" }

async-stream = "0.3"
futures-core = "0.3"
http = "1"
jiff = { version = "0.2", features = ["serde"] }
reqwest = { version = "0.13", features = ["json"] }
secrecy = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["time"] }
tracing = "0.1"
url = "2"

futures = "0.3"
wiremock = "0.6"

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
